# Atlas Chatbot — Docker Compose
# Starts PostgreSQL for local development.
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas_db
    ports:
      - "5433:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  atlas_pgdata:
